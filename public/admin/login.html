<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CYNETWORK PISOWIFI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2D1B1B 0%, #C83232 100%);
            --bg-gradient: radial-gradient(circle at center, #A02828 0%, #1A0A0A 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #A02828; /* Fallback */
            background: var(--bg-gradient);
            background-attachment: fixed;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            color: #222;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 14px;
            color: #C83232;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #DDD;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #C83232;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #E74C3C;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <div class="logo-icon">🌐</div>
            <div class="brand-name">CYNETWORK</div>
            <div class="brand-sub">PISOWIFI Admin</div>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="email" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <div id="error-msg" class="error-msg">Invalid credentials</div>
        </form>
    </div>

    <script src="/admin/login.js"></script>
</body>
</html>
